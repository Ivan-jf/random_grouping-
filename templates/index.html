<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>随机分组工具</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f0f4f8;
      color: #2d3748;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #2b6cb0 0%, #2c7a7b 100%);
      color: #fff;
      padding: 22px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
    }

    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .5px; }
    header .author { font-size: .85rem; opacity: .85; }

    main {
      max-width: 1000px;
      margin: 36px auto;
      padding: 0 20px 60px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 28px 32px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: #2b6cb0;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #ebf4ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h2 .step-badge {
      background: #2b6cb0;
      color: #fff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: .78rem;
      flex-shrink: 0;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-row.single { grid-template-columns: 1fr; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: .85rem;
      font-weight: 600;
      color: #4a5568;
    }

    label .hint {
      font-weight: 400;
      color: #a0aec0;
      font-size: .78rem;
      margin-left: 4px;
    }

    input[type="text"],
    input[type="number"],
    select {
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: .92rem;
      color: #2d3748;
      background: #f7fafc;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
      width: 100%;
    }

    input:focus,
    select:focus {
      border-color: #2b6cb0;
      box-shadow: 0 0 0 3px rgba(43,108,176,.12);
      background: #fff;
    }

    select option[value=""] { color: #a0aec0; }

    .upload-area {
      border: 2px dashed #bee3f8;
      border-radius: 10px;
      padding: 28px;
      text-align: center;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      background: #ebf8ff;
      position: relative;
    }

    .upload-area:hover { background: #e0f0ff; border-color: #2b6cb0; }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-area .icon { font-size: 2rem; margin-bottom: 8px; }
    .upload-area p { font-size: .9rem; color: #4a5568; }

    .upload-area .file-name {
      margin-top: 8px;
      font-size: .82rem;
      color: #2b6cb0;
      font-weight: 600;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 22px;
      border-radius: 8px;
      border: none;
      font-size: .92rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }

    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg,#2b6cb0,#2c7a7b); color: #fff; }
    .btn-primary:hover:not(:disabled) { opacity: .9; }
    .btn-success { background: linear-gradient(135deg,#276749,#2f855a); color: #fff; }
    .btn-success:hover:not(:disabled) { opacity: .9; }

    .btn-outline {
      background: #fff;
      color: #2b6cb0;
      border: 1.5px solid #2b6cb0;
    }

    .btn-outline:hover { background: #ebf4ff; }

    .btn-danger-outline {
      background: #fff;
      color: #c53030;
      border: 1.5px solid #c53030;
    }

    .btn-danger-outline:hover { background: #fff5f5; }

    .alert {
      border-radius: 8px;
      padding: 12px 16px;
      font-size: .88rem;
      margin-bottom: 16px;
      display: none;
    }

    .alert.error { background: #fff5f5; border-left: 4px solid #fc8181; color: #c53030; }
    .alert.success { background: #f0fff4; border-left: 4px solid #68d391; color: #276749; }
    .alert.info { background: #ebf8ff; border-left: 4px solid #63b3ed; color: #2b6cb0; }
    .alert.show { display: block; }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .table-wrap { overflow-x: auto; margin-top: 16px; }
    #preview-table {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(45, 55, 72, .06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }

    thead th {
      background: #ebf4ff;
      color: #2b6cb0;
      font-weight: 700;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 2px solid #bee3f8;
    }

    tbody tr:nth-child(even) { background: #f7fafc; }

    tbody td {
      padding: 8px 14px;
      border-bottom: 1px solid #e2e8f0;
      color: #4a5568;
    }

    #preview-table tbody tr[onclick] { cursor: pointer; }
    #preview-table tbody tr.selected-row td {
      background: #eaf3ff;
      border-bottom-color: #d7e7fb;
    }
    #preview-table tbody tr.selected-first td { border-top: 2px solid #4388d8; }
    #preview-table tbody tr.selected-last td { border-bottom: 2px solid #4388d8; }
    #preview-table tbody tr.selected-row td:first-child { border-left: 2px solid #4388d8; }
    #preview-table tbody tr.selected-row td:last-child { border-right: 2px solid #4388d8; }
    #preview-table tbody tr.selected-first td:first-child { border-top-left-radius: 10px; }
    #preview-table tbody tr.selected-first td:last-child { border-top-right-radius: 10px; }
    #preview-table tbody tr.selected-last td:first-child { border-bottom-left-radius: 10px; }
    #preview-table tbody tr.selected-last td:last-child { border-bottom-right-radius: 10px; }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: .78rem;
      font-weight: 600;
      background: #bee3f8;
      color: #2b6cb0;
    }

    #result-section { display: none; }

    .result-meta {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .meta-item {
      background: #ebf8ff;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: .88rem;
      color: #2b6cb0;
      font-weight: 600;
    }

    .meta-item span { font-weight: 400; color: #4a5568; }

    .empty-text {
      color: #a0aec0;
      font-size: .88rem;
      padding: 8px 0;
    }

    .section-title {
      font-size: .95rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 8px;
    }

    .section-title.with-margin { margin: 20px 0 8px; }

    footer {
      text-align: center;
      padding: 20px;
      color: #a0aec0;
      font-size: .8rem;
    }

    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
      header { flex-direction: column; gap: 6px; text-align: center; }
      main { padding: 0 12px 60px; }
      .card { padding: 22px 18px; }
    }

    @media print {
      body { background: #fff; }
      header,
      footer,
      .card:not(#result-section),
      #reset-btn,
      .result-meta {
        display: none !important;
      }

      #result-section {
        display: block !important;
        box-shadow: none;
        padding: 0;
      }
    }
  </style>
</head>

<body>
<header>
  <h1>🔀 随机分组工具</h1>
  <div class="author">作者：张济甫 &nbsp;|&nbsp; Random Grouping Tool</div>
</header>

<main>
  <div class="card">
    <h2><span class="step-badge">1</span> 上传数据文件</h2>

    <div class="upload-area" id="upload-area">
      <input type="file" id="file-input" accept=".xlsx,.xls" />
      <div class="icon">📂</div>
      <p>点击或拖拽上传 Excel 文件（.xlsx / .xls）</p>
      <div class="file-name" id="file-name-display"></div>
    </div>

    <div id="upload-alert" class="alert"></div>

    <div style="margin-top:14px;">
      <button class="btn btn-primary" id="upload-btn" onclick="uploadFile()">
        <span class="spinner" id="upload-spinner"></span>
        📤 上传并读取列名
      </button>
    </div>
  </div>

  <div class="card" id="param-card" style="display:none;">
    <h2><span class="step-badge">2</span> 设置分组参数</h2>

    <div id="param-alert" class="alert"></div>

    <div class="form-row">
      <div class="form-group">
        <label>样品 ID 列 <span class="hint">唯一标识每只小鼠，例如耳标号</span></label>
        <select id="id-col"><option value="">-- 请选择 --</option></select>
      </div>

      <div class="form-group">
        <label>长列 <span class="hint">已按关键词自动识别</span></label>
        <select id="length-col"><option value="">-- 请选择 --</option></select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>宽列 <span class="hint">已按关键词自动识别</span></label>
        <select id="width-col"><option value="">-- 请选择 --</option></select>
      </div>
      <div class="form-group">
        <label>每组人数 <span class="hint">例如每组 8 只，就填 8</span></label>
        <input type="number" id="group-num" min="1" value="2" placeholder="例如：8" />
      </div>
    </div>

    <div class="form-row single">
      <div class="form-group">
        <label>分组名称 <span class="hint">逗号分隔，中英文逗号都可以，例如：PBS,模型组，给药组</span></label>
        <input type="text" id="group-names" placeholder="例如：PBS,模型组，低剂量组，高剂量组" />
      </div>
    </div>

    <div style="margin-top:8px; padding:12px 14px; background:#f0f7ff; border-radius:8px; font-size:.83rem; color:#2b4c6f; border-left:3px solid #63b3ed;">
      体积会按 <strong>长 × 宽 × 宽 ÷ 2</strong> 自动计算，并按体积从大到小排列。
    </div>

    <div style="margin-top:18px;">
      <button class="btn btn-primary" id="run-btn" onclick="runGrouping()">
        <span class="spinner" id="run-spinner"></span>
        🚀 生成体积排序
      </button>
    </div>
  </div>

  <div class="card" id="result-section">
    <h2><span class="step-badge">3</span> 分组结果</h2>

    <div id="result-meta" class="result-meta"></div>

    <div id="range-picker" style="display:none; margin:16px 0; padding:16px; background:#f7fafc; border:1px solid #e2e8f0; border-radius:10px;">
      <div class="section-title">选择连续范围 <span class="hint">覆盖数量固定为组数 × 每组人数</span></div>
      <div style="display:flex; align-items:end; gap:12px; flex-wrap:wrap;">
        <div class="form-group" style="max-width:220px;">
          <label>开始序号 <span class="hint">从 1 开始</span></label>
          <input type="number" id="start-index-input" min="1" value="1" />
        </div>
        <div id="range-label" style="padding-bottom:10px; color:#2b6cb0; font-weight:600;"></div>
      </div>
      <button class="btn btn-primary" id="confirm-range-btn" onclick="confirmRange()" style="margin-top:12px;">确认范围并随机分组</button>
    </div>

    <h3 class="section-title hide-print">📊 各组统计摘要</h3>
    <div class="table-wrap" id="summary-table"></div>

    <h3 class="section-title with-margin hide-print">👀 数据预览</h3>
    <div class="table-wrap" id="preview-table"></div>

    <div style="margin-top:20px; display:flex; gap:12px; flex-wrap:wrap;">
      <a class="btn btn-success" id="download-btn" href="#" download>⬇️ 下载完整 Excel 结果</a>
      <button class="btn btn-outline" id="reset-btn" onclick="resetAll()">🔄 重新分组</button>
    </div>
  </div>
</main>

<footer>Random Grouping Tool &nbsp;·&nbsp; 作者：张济甫 &nbsp;·&nbsp; Powered by Python / Flask</footer>

<script>
  let uploadedFilepath = null;
  let previewRows = [];
  let requiredCount = 0;
  let selectedStart = 0;

  document.getElementById('file-input').addEventListener('change', function() {
    const name = this.files[0] ? this.files[0].name : '';
    document.getElementById('file-name-display').textContent = name ? '已选择：' + name : '';
  });

  function showAlert(id, msg, type) {
    const el = document.getElementById(id);
    el.className = 'alert ' + type + ' show';
    el.textContent = msg;
  }

  function hideAlert(id) {
    document.getElementById(id).className = 'alert';
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  async function uploadFile() {
    const fileInput = document.getElementById('file-input');

    if (!fileInput.files[0]) {
      showAlert('upload-alert', '请先选择文件', 'error');
      return;
    }

    hideAlert('upload-alert');

    const btn = document.getElementById('upload-btn');
    const spinner = document.getElementById('upload-spinner');

    btn.disabled = true;
    spinner.style.display = 'inline-block';

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    try {
      const res = await fetch('/get_columns', { method: 'POST', body: formData });
      const data = await res.json();

      if (data.error) {
        showAlert('upload-alert', data.error, 'error');
        return;
      }

      uploadedFilepath = data.filepath;
      populateSelects(data.columns, data.length_col, data.width_col);

      document.getElementById('param-card').style.display = 'block';
      document.getElementById('result-section').style.display = 'none';

      showAlert('upload-alert', `✅ 文件读取成功，共 ${data.columns.length} 列`, 'success');
    } catch(e) {
      showAlert('upload-alert', '上传失败：' + e.message, 'error');
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
    }
  }

  function populateSelects(columns, lengthCol, widthCol) {
    ['id-col', 'length-col', 'width-col'].forEach(id => {
      const sel = document.getElementById(id);
      sel.innerHTML = '<option value="">-- 请选择 --</option>';

      columns.forEach(col => {
        const opt = document.createElement('option');
        opt.value = col;
        opt.textContent = col;
        sel.appendChild(opt);
      });

      if (id === 'id-col') {
        const defaultId = columns.find(col => String(col).includes('耳标'));
        if (defaultId) sel.value = defaultId;
      } else if (id === 'length-col') {
        sel.value = lengthCol;
      } else if (id === 'width-col') {
        sel.value = widthCol;
      }
    });
  }

  async function runGrouping() {
    hideAlert('param-alert');

    const idCol = document.getElementById('id-col').value;
    const lengthCol = document.getElementById('length-col').value;
    const widthCol = document.getElementById('width-col').value;
    const groupNum = document.getElementById('group-num').value;
    const groupNames = document.getElementById('group-names').value;

    if (!idCol) { showAlert('param-alert', '请选择样品 ID 列', 'error'); return; }
    if (!lengthCol || !widthCol) { showAlert('param-alert', '请选择长列和宽列', 'error'); return; }
    if (!groupNum || groupNum < 1) { showAlert('param-alert', '请输入有效的每组人数', 'error'); return; }
    if (!groupNames) { showAlert('param-alert', '请输入分组名称', 'error'); return; }

    const btn = document.getElementById('run-btn');
    const spinner = document.getElementById('run-spinner');

    btn.disabled = true;
    spinner.style.display = 'inline-block';

    try {
      const res = await fetch('/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          filepath: uploadedFilepath,
          group_num: groupNum,
          group_names: groupNames,
          id_col: idCol,
          length_col: lengthCol,
          width_col: widthCol,
          preview_only: true
        })
      });

      const data = await res.json();

      if (data.error) {
        showAlert('param-alert', '❌ ' + data.error, 'error');
        return;
      }

      renderPreview(data);
    } catch(e) {
      showAlert('param-alert', '请求失败：' + e.message, 'error');
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
    }
  }

  function renderPreview(data) {
    const sec = document.getElementById('result-section');
    sec.style.display = 'block';
    sec.scrollIntoView({ behavior: 'smooth' });

    previewRows = data.preview || [];
    requiredCount = data.required_count;
    const names = document.getElementById('group-names').value;

    document.getElementById('result-meta').innerHTML = `
      <div class="meta-item">原始样品数 <span>${escapeHtml(data.source_total ?? data.total)}</span></div>
      <div class="meta-item">待选择总数 <span>${escapeHtml(requiredCount)}</span></div>
      <div class="meta-item">分组数量 <span>${escapeHtml(names.split(/[,，]/).filter(s => s.trim()).length)}</span></div>
      <div class="meta-item">每组人数 <span>${escapeHtml(document.getElementById('group-num').value)}</span></div>
      <div class="meta-item">当前状态 <span>请选择连续范围</span></div>
    `;
    document.getElementById('summary-table').innerHTML = '';
    selectedStart = 0;
    document.getElementById('start-index-input').max = Math.max(1, previewRows.length - requiredCount + 1);
    document.getElementById('start-index-input').value = 1;
    document.getElementById('range-picker').style.display = 'block';
    updateRangeLabel();
    renderPreviewTable();
  }

  document.getElementById('start-index-input').addEventListener('input', function() {
    selectedStart = Math.max(0, Number(this.value || 1) - 1);
    clampStartIndex();
    updateRangeLabel();
    renderPreviewTable();
  });

  function updateRangeLabel() {
    const start = selectedStart;
    const end = start + requiredCount;
    document.getElementById('range-label').textContent = `覆盖第 ${start + 1} - ${end} 只，共 ${requiredCount} 只小鼠`;
  }

  function clampStartIndex() {
    const maxStart = Math.max(0, previewRows.length - requiredCount);
    selectedStart = Math.min(Math.max(0, selectedStart), maxStart);
    document.getElementById('start-index-input').value = selectedStart + 1;
  }

  function renderPreviewTable() {
    const rows = previewRows.map((row, index) => ({'序号': index + 1, ...row}));
    document.getElementById('preview-table').innerHTML = buildTable(rows, true);
  }

  function chooseStart(index) {
    selectedStart = index;
    clampStartIndex();
    updateRangeLabel();
    renderPreviewTable();
  }

  async function confirmRange() {
    const body = {
      filepath: uploadedFilepath,
      group_num: document.getElementById('group-num').value,
      group_names: document.getElementById('group-names').value,
      id_col: document.getElementById('id-col').value,
      length_col: document.getElementById('length-col').value,
      width_col: document.getElementById('width-col').value,
      start_index: selectedStart
    };
    const btn = document.getElementById('confirm-range-btn');
    btn.disabled = true;
    try {
      const res = await fetch('/run', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      const data = await res.json();
      if (data.error) { showAlert('param-alert', '❌ ' + data.error, 'error'); return; }
      renderResult(data);
    } catch (e) { showAlert('param-alert', '请求失败：' + e.message, 'error'); }
    finally { btn.disabled = false; }
  }

  function renderResult(data) {
    document.getElementById('range-picker').style.display = 'none';
    document.getElementById('summary-table').innerHTML = buildTable(data.summary);
    document.getElementById('preview-table').innerHTML = buildTable(data.preview);
    document.getElementById('result-meta').innerHTML += `<div class="meta-item">已完成 <span>${escapeHtml(data.total)} 只</span></div>`;
    document.getElementById('download-btn').href = `/download/${encodeURIComponent(data.out_file)}`;
  }

  function buildTable(rows, selectable = false) {
    if (!rows || rows.length === 0) {
      return '<p style="color:#a0aec0">暂无数据</p>';
    }

    const keys = Object.keys(rows[0]);
    let html = '<table><thead><tr>';

    keys.forEach(k => {
      html += `<th>${escapeHtml(k)}</th>`;
    });

    html += '</tr></thead><tbody>';

    rows.forEach((row, rowIndex) => {
      const selected = selectable && rowIndex >= selectedStart && rowIndex < selectedStart + requiredCount;
      const first = selected && rowIndex === selectedStart;
      const last = selected && rowIndex === selectedStart + requiredCount - 1;
      const classes = selected ? ` class="selected-row${first ? ' selected-first' : ''}${last ? ' selected-last' : ''}"` : '';
      html += `<tr${classes}${selectable ? ` onclick="chooseStart(${rowIndex})"` : ''}>`;

      keys.forEach(k => {
        const val = row[k];
        const displayVal = val !== null && val !== undefined
          ? (k === '体积' && Number.isFinite(Number(val)) ? Number(val).toFixed(2) : val)
          : '-';

        if (k === 'group' || k === '分组') {
          html += `<td><span class="badge">${escapeHtml(displayVal)}</span></td>`;
        } else {
          html += `<td>${escapeHtml(displayVal)}</td>`;
        }
      });

      html += '</tr>';
    });

    html += '</tbody></table>';
    return html;
  }

  function resetAll() {
    document.getElementById('result-section').style.display = 'none';
